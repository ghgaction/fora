<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>watchlist.js tests</title>
<style>body{font-family:monospace;padding:20px}.pass{color:#15803d}.fail{color:#b91c1c;font-weight:700}h2.pass{color:#15803d}h2.fail{color:#b91c1c}</style>
<script>window.WATCHLIST_NO_AUTORUN = true;</script>
<script src="./watchlist.js"></script>
</head><body>
<h1>watchlist.js unit tests</h1><div id="out"></div>
<script>
var out = document.getElementById('out'), pass = 0, fail = 0, W = window.Watchlist;
function check(name, cond){var d=document.createElement('div');d.className=cond?'pass':'fail';
  d.textContent=(cond?'PASS  ':'FAIL  ')+name;out.appendChild(d);cond?pass++:fail++;}

check('good (up) news discloses', W.shouldDisclose({direction:'up',summary:'x'}) === true);
check('neutral (flat) news discloses', W.shouldDisclose({direction:'flat',summary:'x'}) === true);
check('bad news without note is HELD', W.shouldDisclose({direction:'down',summary:'x',note:''}) === false);
check('bad news with note discloses', W.shouldDisclose({direction:'down',summary:'x',note:'all fine'}) === true);
check('bad news with whitespace-only note is HELD', W.shouldDisclose({direction:'down',note:'   '}) === false);
check('null update is HELD', W.shouldDisclose(null) === false);

localStorage.removeItem(W.STORE_KEY);
check('store starts empty', W.getFollows().length === 0);
var rec = {signal:'grievances',project:'P1',projectName:'Proj One',label:'Grievance Mechanism',href:'community.html#follow-grievances'};
check('toggle adds -> returns true', W.toggleFollow(rec) === true);
check('isFollowed true after add', W.isFollowed('P1','grievances') === true);
check('getFollows length 1', W.getFollows().length === 1);
check('toggle again -> returns false', W.toggleFollow(rec) === false);
check('isFollowed false after remove', W.isFollowed('P1','grievances') === false);
localStorage.removeItem(W.STORE_KEY);

check('fixture: grievances update exists', W.getUpdate('PR-KFT-0142','grievances') !== null);
check('fixture: unknown signal -> null', W.getUpdate('PR-KFT-0142','nope') === null);
check('fixture: held bad news (fire) does NOT disclose', W.shouldDisclose(W.getUpdate('PR-KFT-0142','fire-disturbance')) === false);
check('fixture: noted bad news (grievances) DOES disclose', W.shouldDisclose(W.getUpdate('PR-KFT-0142','grievances')) === true);

var s=document.createElement('h2');s.textContent=pass+' passed, '+fail+' failed';s.className=fail?'fail':'pass';out.appendChild(s);
</script></body></html>
